# Checks every new Keycloak release against our extensions automatically.
#
# Once a day the newest final Keycloak release is looked up in Maven Central. If it is newer
# than keycloak.version in pom.xml and there is no issue for it yet, ci/kc-compat/run-all.sh
# runs (build, tests, bytecode/API/dependency comparison, Keycloak start with the old and the
# rebuilt jar), followed by the Kerberos end-to-end test (ci/kerberos-e2e) against the new
# release, the login end-to-end test (ci/login-e2e) and the IdP group mapper end-to-end test
# (ci/idp-mapper-e2e), and the result is filed as an issue.
# The Kerberos test matters most: the on-demand Kerberos authenticator relies on flow-engine
# behaviour that a release could change.
#
# Manually: Actions → "Keycloak compatibility" → Run workflow, optionally with versions.
# To check a version again: delete its issue or start the workflow manually.
name: Keycloak compatibility

on:
  schedule:
    - cron: "17 5 * * *"   # daily 05:17 UTC
  workflow_dispatch:
    inputs:
      keycloak_version:
        description: "Keycloak version to check (empty = newest)"
        required: false
        default: ""
      baseline_version:
        description: "Base version of the old jar (empty = keycloak.version from pom.xml)"
        required: false
        default: ""
      create_issue:
        description: "File the result as an issue (or comment on the existing one)"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: keycloak-compat
  cancel-in-progress: false

jobs:
  detect:
    name: Detect new version
    runs-on: ubuntu-24.04   # pinned so an image change (e.g. preinstalled Maven) cannot silently change anything
    outputs:
      version: ${{ steps.v.outputs.version }}
      baseline: ${{ steps.v.outputs.baseline }}
      title: ${{ steps.v.outputs.title }}
      run: ${{ steps.v.outputs.run }}
    steps:
      - uses: actions/checkout@v5

      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.keycloak_version }}
          INPUT_BASELINE: ${{ inputs.baseline_version }}
        run: |
          NEW="${INPUT_VERSION:-$(ci/kc-compat/latest-version.sh)}"
          BASE="${INPUT_BASELINE:-$(sed -n 's:.*<keycloak.version>\(.*\)</keycloak.version>.*:\1:p' pom.xml | head -n 1)}"
          TITLE="[kc-compat] Keycloak $NEW – compatibility check"
          RUN=true
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "$NEW" = "$BASE" ]; then
              echo "Keycloak $NEW already is the base version – nothing to do."
              RUN=false
            elif [ "$(printf '%s\n%s\n' "$NEW" "$BASE" | sort -V | tail -n 1)" != "$NEW" ]; then
              echo "Keycloak $NEW is older than the base version $BASE – nothing to do."
              RUN=false
            # match on the prefix so renamed/older (e.g. German) titles still count
            elif [ -n "$(gh issue list --state all --limit 50 --search "Keycloak $NEW in:title" --json title \
                         --jq ".[] | select(.title | startswith(\"[kc-compat] Keycloak $NEW \")) | .title")" ]; then
              echo "There already is an issue for Keycloak $NEW – nothing to do."
              RUN=false
            fi
          fi
          echo "New: $NEW, base: $BASE, check: $RUN"
          {
            echo "version=$NEW"
            echo "baseline=$BASE"
            echo "title=$TITLE"
            echo "run=$RUN"
          } >> "$GITHUB_OUTPUT"

  check:
    name: Check Keycloak ${{ needs.detect.outputs.version }}
    needs: detect
    if: needs.detect.outputs.run == 'true'
    runs-on: ubuntu-24.04   # pinned so an image change (e.g. preinstalled Maven) cannot silently change anything
    timeout-minutes: 45
    env:
      WORK_DIR: ${{ github.workspace }}/.kc-compat
      NEW: ${{ needs.detect.outputs.version }}
      BASE: ${{ needs.detect.outputs.baseline }}
    steps:
      - uses: actions/checkout@v5

      # Keycloak 26 only runs on Java 21+; our code is still compiled for Java 17.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compatibility check
        id: check
        continue-on-error: true
        run: ci/kc-compat/run-all.sh "$NEW" "$BASE"

      - name: Install MIT Kerberos (for the Kerberos e2e)
        id: krb_install
        continue-on-error: true
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q krb5-kdc krb5-admin-server krb5-user

      - name: Kerberos e2e against Keycloak ${{ needs.detect.outputs.version }}
        id: kerberos
        continue-on-error: true
        run: |
          set -o pipefail
          jar="$WORK_DIR/jars/new.jar"; [ -f "$jar" ] || jar="$WORK_DIR/jars/old.jar"
          if [ ! -f "$jar" ]; then echo "no jar from the compatibility check"; exit 1; fi
          WORK_DIR="$GITHUB_WORKSPACE/.kerberos-e2e" ci/kerberos-e2e/run.sh "$NEW" "$jar" 2>&1 | tee "$WORK_DIR/kerberos-e2e.log"

      - name: Login e2e against Keycloak ${{ needs.detect.outputs.version }}
        id: login
        continue-on-error: true
        run: |
          set -o pipefail
          jar="$WORK_DIR/jars/new.jar"; [ -f "$jar" ] || jar="$WORK_DIR/jars/old.jar"
          if [ ! -f "$jar" ]; then echo "no jar from the compatibility check"; exit 1; fi
          mkdir -p "$WORK_DIR"
          WORK_DIR="$GITHUB_WORKSPACE/.login-e2e" ci/login-e2e/run.sh "$NEW" "$jar" 2>&1 | tee "$WORK_DIR/login-e2e.log"

      - name: IdP mapper e2e against Keycloak ${{ needs.detect.outputs.version }}
        id: idpmapper
        continue-on-error: true
        run: |
          set -o pipefail
          jar="$WORK_DIR/jars/new.jar"; [ -f "$jar" ] || jar="$WORK_DIR/jars/old.jar"
          if [ ! -f "$jar" ]; then echo "no jar from the compatibility check"; exit 1; fi
          mkdir -p "$WORK_DIR"
          WORK_DIR="$GITHUB_WORKSPACE/.idp-mapper-e2e" ci/idp-mapper-e2e/run.sh "$NEW" "$jar" 2>&1 | tee "$WORK_DIR/idp-mapper-e2e.log"

      - name: Add the e2e tests to the report
        if: always()
        env:
          OUTCOME: ${{ steps.kerberos.outcome }}
          LOGIN_OUTCOME: ${{ steps.login.outcome }}
          IDPMAPPER_OUTCOME: ${{ steps.idpmapper.outcome }}
        run: |
          section="$RUNNER_TEMP/kerberos.md"
          {
            echo
            echo "## Kerberos e2e (sit-auth-spnego-button)"
            echo
            if [ "$OUTCOME" = "success" ]; then echo "Result: **PASS**"; else echo "Result: **FAIL** ($OUTCOME)"; fi
            echo
            echo '```'
            cat .kerberos-e2e/e2e.out 2>/dev/null || tail -n 40 "$WORK_DIR/kerberos-e2e.log" 2>/dev/null || echo "no output"
            echo '```'
            echo
            echo "## Login e2e (sit-auth-username-password-form)"
            echo
            if [ "$LOGIN_OUTCOME" = "success" ]; then echo "Result: **PASS**"; else echo "Result: **FAIL** ($LOGIN_OUTCOME)"; fi
            echo
            echo '```'
            cat .login-e2e/e2e.out 2>/dev/null || tail -n 40 "$WORK_DIR/login-e2e.log" 2>/dev/null || echo "no output"
            echo '```'
            echo
            echo "## IdP mapper e2e (sit-oidc-group-idp-mapper)"
            echo
            if [ "$IDPMAPPER_OUTCOME" = "success" ]; then echo "Result: **PASS**"; else echo "Result: **FAIL** ($IDPMAPPER_OUTCOME)"; fi
            echo
            echo '```'
            cat .idp-mapper-e2e/e2e.out 2>/dev/null || tail -n 40 "$WORK_DIR/idp-mapper-e2e.log" 2>/dev/null || echo "no output"
            echo '```'
          } > "$section"
          mkdir -p "$WORK_DIR"
          for f in report.md issue.md; do cat "$section" >> "$WORK_DIR/$f"; done

      - name: Job summary
        if: always()
        run: |
          if [ -f "$WORK_DIR/report.md" ]; then
            head -c 900000 "$WORK_DIR/report.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report was produced – see the log of the 'Compatibility check' step." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: kc-compat-report
          path: |
            .kc-compat/report.md
            .kc-compat/summary.md
            .kc-compat/issue.md
            .kc-compat/build-*.log
            .kc-compat/smoke-*.log
            .kc-compat/smoke-*.out
            .kc-compat/kerberos-e2e.log
            .kerberos-e2e/e2e.out
            .kerberos-e2e/keycloak.log
            .kc-compat/login-e2e.log
            .login-e2e/e2e.out
            .login-e2e/keycloak.log
            .kc-compat/idp-mapper-e2e.log
            .idp-mapper-e2e/e2e.out
            .idp-mapper-e2e/keycloak.log
          include-hidden-files: true   # .kc-compat/ starts with a dot
          if-no-files-found: warn
          retention-days: 90

      - name: File issue
        if: always() && (github.event_name == 'schedule' || inputs.create_issue)
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ needs.detect.outputs.title }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="$RUNNER_TEMP/issue.md"
          if [ -f "$WORK_DIR/issue.md" ]; then
            cp "$WORK_DIR/issue.md" "$body"
          else
            echo "The compatibility check did not produce a report (aborted)." > "$body"
          fi
          printf '\n\nWorkflow run with the full report: %s\n' "$RUN_URL" >> "$body"

          existing=$(gh issue list --state all --limit 50 --search "Keycloak $NEW in:title" --json number,title \
                       --jq ".[] | select(.title | startswith(\"[kc-compat] Keycloak $NEW \")) | .number" | head -n 1)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file "$body"
          else
            gh issue create --title "$TITLE" --body-file "$body"
          fi

      - name: Result
        if: steps.check.outcome == 'failure' || steps.kerberos.outcome == 'failure' || steps.login.outcome == 'failure'
        env:
          CHECK: ${{ steps.check.outcome }}
          KERBEROS: ${{ steps.kerberos.outcome }}
          LOGIN: ${{ steps.login.outcome }}
        run: |
          [ "$CHECK" = "failure" ] && echo "::error::The compatibility check against Keycloak $NEW failed – see the summary."
          [ "$KERBEROS" = "failure" ] && echo "::error::The Kerberos e2e against Keycloak $NEW failed – see the summary."
          [ "$LOGIN" = "failure" ] && echo "::error::The login e2e against Keycloak $NEW failed – see the summary."
          exit 1
