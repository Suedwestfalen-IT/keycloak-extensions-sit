# End-to-end tests for sit-oidc-group-idp-mapper against the real Keycloak distribution with our jar:
# Keycloak brokers itself (upstream/broker realm), every sync mode is played with curl logins
# (first login, group change upstream, group assigned after the first login), and the Keycloak log
# is checked for one summary line per sync and no sync-mode warning. See ci/idp-mapper-e2e/run.sh.
name: IdP mapper e2e

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      keycloak_version:
        description: "Keycloak version (empty = keycloak.version from pom.xml)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  e2e:
    name: Keycloak broker + curl
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build provider jar
        run: mvn -B --no-transfer-progress -DskipTests package

      - name: Run end-to-end test
        env:
          INPUT_VERSION: ${{ inputs.keycloak_version }}
        run: |
          set -o pipefail
          ci/idp-mapper-e2e/run.sh ${INPUT_VERSION:+"$INPUT_VERSION"} 2>&1 | tee e2e-run.log

      - name: Report failures as annotations
        if: failure()
        # "|| true": the step runs under bash -e, and grep exits 1 when nothing matches, which
        # would skip the tail exactly when the log has no FAIL/ERROR line to show.
        run: |
          { grep -E "^FAIL |^\[e2e\]|ERROR|Traceback|Error" e2e-run.log || true; echo "--- tail:"; tail -n 15 e2e-run.log; } \
            | head -n 60 | while IFS= read -r line; do echo "::error::${line}"; done

      - name: Summary
        if: always()
        run: |
          {
            echo "### IdP mapper e2e"
            echo
            echo '```'
            cat .idp-mapper-e2e/e2e.out 2>/dev/null || echo "no output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: idp-mapper-e2e
          path: |
            .idp-mapper-e2e/e2e.out
            .idp-mapper-e2e/keycloak.log
            e2e-run.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30
